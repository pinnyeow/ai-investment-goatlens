# Render Blueprint for GOATlens (free plan). The server only reads nightly
# snapshots from the repo's `data` branch, so it needs no API keys.
services:
  - type: web
    name: goatlens
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    # Deploy main only after GitHub checks (CI) pass. Set here because Blueprint
    # syncs overwrite dashboard settings.
    autoDeployTrigger: checksPass
