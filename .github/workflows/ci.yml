name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: backend
        run: |
          pip install ruff pytest pytest-asyncio pyyaml
          pip install -r requirements.txt

      - name: Deterministic full verification
        working-directory: ${{ github.workspace }}
        run: python scripts/verify_goatlens.py

      - name: Representative five-agent fixture matrix and optimized affected validation
        # Includes test_representative_fixture_matrix_exact_contract via the affected suite.
        working-directory: ${{ github.workspace }}
        run: python -O scripts/verify_goatlens.py --affected-only
