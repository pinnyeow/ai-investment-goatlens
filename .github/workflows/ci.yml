name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r backend/requirements-dev.txt
      - name: Lint
        working-directory: backend
        run: ruff check .
      - name: Tests
        working-directory: backend
        run: python -m pytest -q tests

  live-build-sample:
    # Builds a real sample from Yahoo (nothing is published) and fails if
    # fewer than 90% of these companies get all five investors.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-build.txt
      - run: pip install -r backend/requirements-build.txt
      - name: Build 25 representative companies
        working-directory: backend
        run: |
          python -m lens.build --out /tmp/sample --pause 0.2 \
            --tickers AAPL,MSFT,NVDA,KO,JPM,TSLA,GOOGL,META,AMZN,WMT,COST,V,BRK-B,XOM,PFE,DIS,NFLX,TSM,SHOP,PLTR,SOFI,CELH,BAC,UNH,O
          python -c "import json; r=json.load(open('/tmp/sample/coverage.json')); print(r); assert r['fresh'] == 25, 'fetch failures'; assert r['all_five_rate'] >= 0.9, 'coverage dropped below 90%'"
