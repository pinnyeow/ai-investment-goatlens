name: Smoke Tests

# Daily check of the live site and of last night's data.
on:
  schedule:
    - cron: '0 13 * * *'
  workflow_run:
    workflows: [Nightly snapshots]
    types: [completed]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Site is up
        run: |
          for i in 1 2 3 4 5 6; do curl -fsS --max-time 60 https://goatlens.onrender.com/health && exit 0; sleep 20; done
          exit 1

      - name: Last night's data is fresh and coverage holds
        run: |
          curl -fsS --max-time 60 https://goatlens.onrender.com/api/coverage > coverage.json
          cat coverage.json
          python3 - <<'PY'
          import json, datetime as dt
          r = json.load(open("coverage.json"))
          age = dt.datetime.now(dt.timezone.utc) - dt.datetime.fromisoformat(r["built_at"])
          assert age < dt.timedelta(days=4), f"data is {age} old"
          assert r["covered"] >= 500, f"only {r['covered']} companies covered"
          assert r["verdict_rate"] >= 0.98, f"only {r['verdict_rate']:.0%} of companies get a verdict"
          assert r["all_five_rate_non_financial"] >= 0.85, f"only {r['all_five_rate_non_financial']:.0%} of non-financial companies get all five investors"
          PY

      - name: Real analyses work end to end
        run: |
          for T in AAPL WMT BRK.B JPM; do
            curl -fsS --max-time 60 -X POST https://goatlens.onrender.com/api/analyze \
              -H 'Content-Type: application/json' -d "{\"ticker\":\"$T\"}" > a.json
            python3 -c "import json,sys; b=json.load(open('a.json')); r=b['agent_results']; assert len(r)==5 and b['consensus_verdict']!='insufficient_data', b; assert all(x['criteria'] for x in r); print('$T', b['consensus_verdict'], b['completed_analyses'], '/ 5')"
          done
          curl -fsS --max-time 60 "https://goatlens.onrender.com/api/price-history/AAPL?period=1y" | python3 -c "import json,sys; assert len(json.load(sys.stdin)['prices']) > 200"
