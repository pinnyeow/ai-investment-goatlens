name: Smoke Tests

on:
  schedule:
    - cron: '17 15 * * *' # daily live dependency canary
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact deployed commit SHA to verify
        required: true
        type: string

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for the expected Render release
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          for ATTEMPT in {1..30}; do
            BODY=$(curl --silent --show-error --max-time 5 \
              https://goatlens.onrender.com/health || true)
            echo "Release check $ATTEMPT: $BODY"
            RELEASE=$(python3 -c 'import json,sys; print(json.load(sys.stdin).get("release", ""))' <<<"$BODY" 2>/dev/null || true)
            if [[ "$RELEASE" == "$EXPECTED_SHA" ]]; then
              echo "Expected release is live."
              exit 0
            fi
            if (( ATTEMPT < 30 )); then
              sleep 15
            fi
          done
          echo "FAIL: Render did not deploy $EXPECTED_SHA within 10 minutes"
          exit 1

      - name: Homepage loads
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://goatlens.onrender.com/)
          echo "Homepage status: $STATUS"
          [ "$STATUS" = "200" ] || (echo "FAIL: Homepage returned $STATUS" && exit 1)

      - name: Health check returns healthy
        run: |
          BODY=$(curl -s https://goatlens.onrender.com/health)
          echo "Health response: $BODY"
          printf '%s' "$BODY" | python3 -c "import json, re, sys; body=json.load(sys.stdin); release=body.get('release', ''); (body.get('status') == 'healthy' and re.fullmatch(r'[0-9a-f]{40}', release)) or sys.exit('FAIL: health response or deployed release is invalid'); print(f'Deployed release: {release}')"

      - name: Authoritative SEC fundamentals path is healthy
        run: |
          BODY=$(curl --fail --silent --show-error \
            --max-time 45 \
            https://goatlens.onrender.com/api/fundamentals-health)
          echo "Fundamentals health: $BODY"
          echo "$BODY" | grep -q '"status":"healthy"' || (echo "FAIL: SEC fundamentals unavailable" && exit 1)
          echo "$BODY" | grep -q '"source":"sec"' || (echo "FAIL: SEC source missing" && exit 1)

      - name: Report Yahoo market-data status without failing the service
        run: |
          BODY=$(curl --silent --show-error \
            --max-time 45 \
            https://goatlens.onrender.com/api/market-data-health || true)
          echo "Yahoo market-data status (non-gating): $BODY"

      - name: AAPL returns five explicit analyses and SEC evidence
        run: |
          BODY=$(curl --fail --silent --show-error \
            --max-time 90 \
            -X POST https://goatlens.onrender.com/api/analyze \
            -H 'Content-Type: application/json' \
            -d '{"ticker":"AAPL","agents":["buffett","lynch","graham","munger","dalio"]}')
          echo "AAPL analysis (truncated): ${BODY:0:500}"
          echo "$BODY" | grep -q '"ticker":"AAPL"' || (echo "FAIL: AAPL analysis missing ticker" && exit 1)
          echo "$BODY" | grep -q '"fundamentals":{"available":true,"source":"sec"' || (echo "FAIL: AAPL analysis is not SEC-backed" && exit 1)
          printf '%s' "$BODY" | python3 -c "import json, sys; body=json.load(sys.stdin); results=body.get('agent_results', []); completed=body.get('completed_analyses'); requested=body.get('requested_analyses'); expected_agents={'Warren Buffett', 'Peter Lynch', 'Benjamin Graham', 'Charlie Munger', 'Ray Dalio'}; valid={item.get('agent') for item in results} == expected_agents and body.get('ticker') == 'AAPL' and requested == 5 and len(results) == 5 and completed == sum(item.get('status') == 'complete' for item in results) and completed >= 2 and all((item.get('score') is not None and item.get('verdict') is not None and not item.get('unavailable_metrics')) if item.get('status') == 'complete' else (item.get('status') == 'incomplete' and item.get('score') is None and item.get('verdict') is None and bool(item.get('unavailable_metrics'))) for item in results) and body.get('consensus_status') == ('complete' if completed == 5 else 'partial') and body.get('data_status', {}).get('fundamentals', {}).get('available') and body.get('data_status', {}).get('fundamentals', {}).get('source') == 'sec' and len(body.get('metric_evidence', {})) >= 28; valid or sys.exit('FAIL: AAPL response is not a complete or honestly degraded five-analysis result'); print(f'AAPL analyses: {completed}/5 complete')"
          echo "$BODY" | grep -q '"revenue":{"value":416161000000' || (echo "FAIL: SEC revenue literal missing" && exit 1)
          echo "$BODY" | grep -q '"accession":"0000320193-25-000079"' || (echo "FAIL: SEC provenance missing" && exit 1)

      - name: AMZN turnaround analysis remains useful or degrades honestly
        run: |
          BODY=$(curl --fail --silent --show-error \
            --max-time 90 \
            -X POST https://goatlens.onrender.com/api/analyze \
            -H 'Content-Type: application/json' \
            -d '{"ticker":"AMZN","agents":["buffett","lynch","graham","munger","dalio"]}')
          echo "AMZN analysis (truncated): ${BODY:0:500}"
          printf '%s' "$BODY" | python3 -c "import json, sys; body=json.load(sys.stdin); evidence=body.get('metric_evidence', {}); results=body.get('agent_results', []); completed=body.get('completed_analyses'); requested=body.get('requested_analyses'); expected_agents={'Warren Buffett', 'Peter Lynch', 'Benjamin Graham', 'Charlie Munger', 'Ray Dalio'}; valid={item.get('agent') for item in results} == expected_agents and body.get('ticker') == 'AMZN' and requested == 5 and len(results) == 5 and completed == sum(item.get('status') == 'complete' for item in results) and completed >= 2 and all((item.get('score') is not None and item.get('verdict') is not None and not item.get('unavailable_metrics')) if item.get('status') == 'complete' else (item.get('status') == 'incomplete' and item.get('score') is None and item.get('verdict') is None and bool(item.get('unavailable_metrics'))) for item in results) and body.get('consensus_status') == ('complete' if completed == 5 else 'partial') and body.get('data_status', {}).get('fundamentals', {}).get('available') and body.get('data_status', {}).get('fundamentals', {}).get('source') == 'sec' and evidence.get('earnings_turnaround', {}).get('available') and evidence.get('earnings_turnaround', {}).get('source') == 'sec' and evidence.get('earnings_turnaround', {}).get('value') == 1.0; valid or sys.exit('FAIL: AMZN response is not a useful or honestly degraded five-analysis result'); print(f'AMZN analyses: {completed}/5 complete')"

      - name: Agents endpoint returns all 5 investors
        if: ${{ always() }}
        run: |
          BODY=$(curl -s https://goatlens.onrender.com/api/agents)
          echo "Agents response: $BODY"
          echo "$BODY" | grep -q '"buffett"' || (echo "FAIL: Missing buffett agent" && exit 1)
          echo "$BODY" | grep -q '"lynch"'   || (echo "FAIL: Missing lynch agent" && exit 1)
          echo "$BODY" | grep -q '"graham"'  || (echo "FAIL: Missing graham agent" && exit 1)
          echo "$BODY" | grep -q '"munger"'  || (echo "FAIL: Missing munger agent" && exit 1)
          echo "$BODY" | grep -q '"dalio"'   || (echo "FAIL: Missing dalio agent" && exit 1)
