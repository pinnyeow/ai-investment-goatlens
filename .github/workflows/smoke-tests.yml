name: Smoke Tests

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 15 * * *' # daily live dependency canary
  workflow_dispatch: # allow manual trigger

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for the expected Render release
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          for ATTEMPT in {1..30}; do
            BODY=$(curl --silent --show-error --max-time 5 \
              https://goatlens.onrender.com/health || true)
            echo "Release check $ATTEMPT: $BODY"
            RELEASE=$(python3 -c 'import json,sys; print(json.load(sys.stdin).get("release", ""))' <<<"$BODY" 2>/dev/null || true)
            if [[ "$RELEASE" == "$EXPECTED_SHA" ]]; then
              echo "Expected release is live."
              exit 0
            fi
            if (( ATTEMPT < 30 )); then
              sleep 15
            fi
          done
          echo "FAIL: Render did not deploy $EXPECTED_SHA within 10 minutes"
          exit 1

      - name: Homepage loads
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://goatlens.onrender.com/)
          echo "Homepage status: $STATUS"
          [ "$STATUS" = "200" ] || (echo "FAIL: Homepage returned $STATUS" && exit 1)

      - name: Health check returns healthy
        run: |
          BODY=$(curl -s https://goatlens.onrender.com/health)
          echo "Health response: $BODY"
          echo "$BODY" | grep -q '"status":"healthy"' || (echo "FAIL: Health check unexpected response" && exit 1)

      - name: Authoritative SEC fundamentals path is healthy
        run: |
          BODY=$(curl --fail --silent --show-error \
            --max-time 45 \
            https://goatlens.onrender.com/api/fundamentals-health)
          echo "Fundamentals health: $BODY"
          echo "$BODY" | grep -q '"status":"healthy"' || (echo "FAIL: SEC fundamentals unavailable" && exit 1)
          echo "$BODY" | grep -q '"source":"sec"' || (echo "FAIL: SEC source missing" && exit 1)

      - name: AAPL all-agent analysis is complete and SEC-backed
        run: |
          BODY=$(curl --fail --silent --show-error \
            --max-time 90 \
            -X POST https://goatlens.onrender.com/api/analyze \
            -H 'Content-Type: application/json' \
            -d '{"ticker":"AAPL","agents":["buffett","lynch","graham","munger","dalio"]}')
          echo "AAPL analysis (truncated): ${BODY:0:500}"
          echo "$BODY" | grep -q '"ticker":"AAPL"' || (echo "FAIL: AAPL analysis missing ticker" && exit 1)
          echo "$BODY" | grep -q '"fundamentals":{"available":true,"source":"sec"' || (echo "FAIL: AAPL analysis is not SEC-backed" && exit 1)
          printf '%s' "$BODY" | python3 -c "import json, sys; body=json.load(sys.stdin); assert body['consensus_status'] == 'complete'; assert body['completed_analyses'] == 5; assert body['requested_analyses'] == 5; assert body['agreement_score'] is not None; assert len(body['agent_results']) == 5; assert all(item['status'] == 'complete' for item in body['agent_results']); assert all(item['score'] is not None and item['verdict'] is not None for item in body['agent_results']); assert len(body['metric_evidence']) >= 28"
          echo "$BODY" | grep -q '"revenue":{"value":416161000000' || (echo "FAIL: SEC revenue literal missing" && exit 1)
          echo "$BODY" | grep -q '"accession":"0000320193-25-000079"' || (echo "FAIL: SEC provenance missing" && exit 1)

      - name: AMZN turnaround analysis is complete with sourced ratio evidence
        run: |
          BODY=$(curl --fail --silent --show-error \
            --max-time 90 \
            -X POST https://goatlens.onrender.com/api/analyze \
            -H 'Content-Type: application/json' \
            -d '{"ticker":"AMZN","agents":["buffett","lynch","graham","munger","dalio"]}')
          echo "AMZN analysis (truncated): ${BODY:0:500}"
          printf '%s' "$BODY" | python3 -c "import json, sys; body=json.load(sys.stdin); evidence=body['metric_evidence']; ratios=body['data_status']['normalized_ratios']; assert body['ticker'] == 'AMZN'; assert body['consensus_status'] == 'complete'; assert body['completed_analyses'] == body['requested_analyses'] == 5; assert len(body['agent_results']) == 5; assert all(item['status'] == 'complete' and item['score'] is not None and item['verdict'] is not None and not item['unavailable_metrics'] for item in body['agent_results']); assert body['data_status']['fundamentals']['available'] and body['data_status']['fundamentals']['source'] == 'sec'; assert ratios['source'] == 'yahoo'; assert evidence['gross_margin']['available'] and (evidence['gross_margin']['source'], evidence['gross_margin']['formula']) in {('yahoo', 'provider_normalized_ratio'), ('sec', 'revenue_minus_cost_of_revenue_divided_by_revenue')}; assert (evidence['dividend_yield']['available'] and evidence['dividend_yield']['value'] == 0.0 and evidence['dividend_yield']['formula'] == 'provider_normalized_ratio') or (not evidence['dividend_yield']['available'] and evidence['dividend_yield']['value'] is None); assert ratios['available'] or evidence['gross_margin']['formula'] == 'revenue_minus_cost_of_revenue_divided_by_revenue'; assert evidence['earnings_turnaround']['available'] and evidence['earnings_turnaround']['source'] == 'sec' and evidence['earnings_turnaround']['value'] == 1.0; assert not evidence['earnings_growth']['available'] and evidence['earnings_growth']['value'] is None"

      - name: Report best-effort Yahoo market-data status once
        run: |
          BODY=$(curl --silent --show-error \
            --max-time 45 \
            https://goatlens.onrender.com/api/market-data-health || true)
          echo "Market data status (non-gating): $BODY"

      - name: Agents endpoint returns all 5 investors
        run: |
          BODY=$(curl -s https://goatlens.onrender.com/api/agents)
          echo "Agents response: $BODY"
          echo "$BODY" | grep -q '"buffett"' || (echo "FAIL: Missing buffett agent" && exit 1)
          echo "$BODY" | grep -q '"lynch"'   || (echo "FAIL: Missing lynch agent" && exit 1)
          echo "$BODY" | grep -q '"graham"'  || (echo "FAIL: Missing graham agent" && exit 1)
          echo "$BODY" | grep -q '"munger"'  || (echo "FAIL: Missing munger agent" && exit 1)
          echo "$BODY" | grep -q '"dalio"'   || (echo "FAIL: Missing dalio agent" && exit 1)
